name: hearth image

# Builds the image this fork's `hearth` branch deploys to hearth.tailcf2c72.ts.net.
# Copied from preview.yml rather than written fresh, so it stays recognisable to
# anyone who knows upstream's build.
#
# `hearth-*` is chosen so this is the only workflow a deploy tag can start:
# upstream's ci.yml triggers on `v*` tags and on `main`, and nothing here pushes
# either. That also means never `git push origin hearth --tags` — that would push
# every inherited `v*` tag and fire a release build per tag.

on:
  push:
    tags:
      - 'hearth-*'
  workflow_dispatch:

concurrency:
  group: hearth-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # Disk, not RAM, is the binding constraint: the xgo base is multi-GB.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Resolves the version stamped into the binary and the frontend, and into a
      # dump's VERSION file — which `vikunja restore` refuses to cross.
      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45 # v2.2.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
      # linux/amd64 only: hearth is x86_64, and the Dockerfile cross-compiles
      # (FROM --platform=$BUILDPLATFORM + ARG TARGETOS/TARGETARCH), so this builds
      # natively on the runner with no QEMU.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.ghd.outputs.describe }}
          cache-from: type=gha
          # ignore-error because a full cache export can exceed the 10GB repo cap;
          # losing the cache must not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
      # The digest is what compose/vikunja/compose.yml pins. Surfaced here so it
      # does not have to be dug out of the package page.
      - name: Report digest
        # Values go via env, not interpolation: a git tag name is attacker-shaped
        # input to a shell even when the only pusher is trusted.
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DESCRIBE: ${{ steps.ghd.outputs.describe }}
        run: |
          {
            echo '### Pin this in `compose/vikunja/compose.yml`'
            echo
            echo '```yaml'
            echo "image: ghcr.io/${REPO}@${DIGEST}"
            echo '```'
            echo
            echo "RELEASE_VERSION: \`${DESCRIBE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
